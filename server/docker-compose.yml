services:
  fin-postgres:
    image: pgvector/pgvector:pg17
    container_name: fin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIN_DB_USER:-fin}
      POSTGRES_PASSWORD: ${FIN_DB_PASSWORD:-fin_local_secret}
      POSTGRES_DB: ${FIN_DB_NAME:-fin_assistant}
    ports:
      - "127.0.0.1:${FIN_DB_PORT:-5438}:5432"
    volumes:
      - fin_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FIN_DB_USER:-fin} -d ${FIN_DB_NAME:-fin_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fin_pgdata:
